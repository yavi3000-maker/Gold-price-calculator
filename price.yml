name: Update gold price

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch PAXG price
        run: python3 scripts/fetch_price.py

      - name: Commit price.json if it changed
        run: |
          git config user.name "gold-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add price.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update price.json"
            git push
          fi
